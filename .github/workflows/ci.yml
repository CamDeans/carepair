# Runs when `mobile/` is the repository root. In a monorepo, move this file to the repo root
# and set defaults.run.working-directory to `mobile`.

name: Mobile CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # expo lint may read env; placeholders avoid missing EXPO_PUBLIC_* in CI
      - name: Lint
        env:
          EXPO_PUBLIC_API_URL: https://ci.placeholder.invalid/api
        run: npm run lint
